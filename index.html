<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo Master - Pro Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="theme-switcher-container">
        <button class="btn btn-theme-toggle shadow rounded-circle" id="themeToggleBtn" onclick="toggleTheme()">
            <i class="bi bi-moon-stars-fill" id="themeIcon"></i>
        </button>
    </div>

    <div class="container py-5">
        <div class="text-center mb-5 animate-fade-in">
            <div class="logo-icon mb-3 mx-auto">
                <i class="bi bi-rocket-takeoff-fill"></i>
            </div>
            <h1 class="fw-bold display-4 header-title mb-1">Todo Master <span class="sparkle">🎯</span></h1>
            <p class="text-muted fw-semibold fs-5">Ultimate Task Intelligence Dashboard</p>
        </div>

        <div class="row g-4 mb-5">
            <div class="col-lg-8">
                <div class="row g-3">
                    <div class="col-6">
                        <div class="status-card bg-glass p-3 rounded-4 d-flex align-items-center h-100">
                            <div class="card-icon bg-purple-soft text-purple me-3"><i class="bi bi-grid-1x2-fill"></i></div>
                            <div><h3 class="fw-bold mb-0" id="count-total">0</h3><small class="text-muted fw-semibold">Total Logs</small></div>
                        </div>
                    </div>
                    <div class="col-6">
                        <div class="status-card bg-glass p-3 rounded-4 d-flex align-items-center h-100">
                            <div class="card-icon bg-info-soft text-info me-3"><i class="bi bi-lightning-charge-fill"></i></div>
                            <div><h3 class="fw-bold mb-0" id="count-active">0</h3><small class="text-muted fw-semibold">Active Run</small></div>
                        </div>
                    </div>
                    <div class="col-6">
                        <div class="status-card bg-glass p-3 rounded-4 d-flex align-items-center h-100">
                            <div class="card-icon bg-success-soft text-success me-3"><i class="bi bi-check-all"></i></div>
                            <div><h3 class="fw-bold mb-0" id="count-completed">0</h3><small class="text-muted fw-semibold">Completed</small></div>
                        </div>
                    </div>
                    <div class="col-6">
                        <div class="status-card bg-glass p-3 rounded-4 d-flex align-items-center h-100">
                            <div class="card-icon bg-danger-soft text-danger me-3"><i class="bi bi-exclamation-triangle-fill"></i></div>
                            <div><h3 class="fw-bold mb-0" id="count-high">0</h3><small class="text-muted fw-semibold">High Priority</small></div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-lg-4">
                <div class="bg-glass p-3 rounded-4 h-100 d-flex flex-column align-items-center justify-content-center shadow-sm">
                    <h6 class="fw-bold text-muted mb-2 text-center">Live Productivity Index</h6>
                    <div style="width: 140px; height: 140px;">
                        <canvas id="productivityChart"></canvas>
                    </div>
                </div>
            </div>
        </div>

        <div class="row justify-content-center">
            <div class="col-xl-10">
                
                <div class="d-flex flex-wrap justify-content-between align-items-center mb-4 gap-3">
                    <div>
                        <h3 class="fw-bold mb-0">Workspace Core</h3>
                        <small class="text-muted fw-medium" id="item-showing-text">Syncing with cluster logs...</small>
                    </div>
                    <div class="d-flex gap-2">
                        <button class="btn btn-outline-danger rounded-3 fw-bold px-3 btn-action-custom" onclick="deleteAllTodos()">
                            <i class="bi bi-trash3-fill me-1"></i> Wipe All
                        </button>
                        <button class="btn btn-outline-secondary rounded-3 fw-bold px-3 btn-action-custom" data-bs-toggle="modal" data-bs-target="#bulkAddModal">
                            <i class="bi bi-stack me-1"></i> Bulk Deploy
                        </button>
                        <button class="btn btn-purple text-white rounded-3 fw-bold px-4 btn-action-custom" data-bs-toggle="collapse" data-bs-target="#addTodoCollapse">
                            <i class="bi bi-plus-circle-fill me-1"></i> Add New Todo
                        </button>
                    </div>
                </div>

                <div class="collapse mb-4" id="addTodoCollapse">
                    <div class="card card-body border-0 shadow-sm rounded-4 p-4 bg-glass">
                        <form id="todo-form">
                            <div class="row g-3">
                                <div class="col-md-6">
                                    <label class="form-label fw-bold">Task Title</label>
                                    <input type="text" id="todo-input" class="form-control rounded-3" placeholder="Define target milestone..." required>
                                </div>
                                <div class="col-md-3">
                                    <label class="form-label fw-bold">Priority Matrix</label>
                                    <select id="todo-priority-select" class="form-select rounded-3">
                                        <option value="Low">🟢 Low</option>
                                        <option value="Medium" selected>🟡 Medium</option>
                                        <option value="High">🔴 High</option>
                                    </select>
                                </div>
                                <div class="col-md-3">
                                    <label class="form-label fw-bold">Initial State</label>
                                    <select id="todo-status-select" class="form-select rounded-3">
                                        <option value="Active">Active</option>
                                        <option value="Inactive">Inactive</option>
                                    </select>
                                </div>
                                <div class="col-12">
                                    <label class="form-label fw-bold">Milestone Summary Description</label>
                                    <textarea id="todo-desc" class="form-control rounded-3" rows="2" placeholder="Document task specifications safely..."></textarea>
                                </div>
                            </div>
                            <div class="text-end mt-3">
                                <button type="button" class="btn btn-light rounded-3 px-3 me-2" data-bs-toggle="collapse" data-bs-target="#addTodoCollapse">Cancel</button>
                                <button type="submit" class="btn btn-purple text-white rounded-3 px-4">Save Matrix</button>
                            </div>
                        </form>
                    </div>
                </div>

                <div class="row g-2 mb-4">
                    <div class="col-md-8">
                        <div class="input-group search-box bg-glass rounded-3 border">
                            <span class="input-group-text border-0 bg-transparent ps-3"><i class="bi bi-search text-muted"></i></span>
                            <input type="text" id="search-input" class="form-control border-0 bg-transparent py-2" placeholder="Filter through cluster titles or descriptions..." oninput="filterAndSearchTodos()">
                        </div>
                    </div>
                    <div class="col-md-4">
                        <select id="status-filter" class="form-select py-2 rounded-3 border bg-glass" onchange="filterAndSearchTodos()">
                            <option value="All">All Node Status</option>
                            <option value="Active"> Active</option>
                            <option value="Completed"> Completed</option>
                            <option value="Inactive"> Inactive</option>
                        </select>
                    </div>
                </div>

                <div id="todo-container" class="d-flex flex-column gap-3"></div>

            </div>
        </div>
    </div>

    <div class="modal fade" id="bulkAddModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-centered">
            <div class="modal-content border-0 rounded-4 shadow-lg bg-glass-modal">
                <div class="modal-header border-bottom-0 px-4 pt-4">
                    <div class="d-flex align-items-center">
                        <div class="card-icon bg-purple-soft text-purple me-3"><i class="bi bi-layers-half"></i></div>
                        <div>
                            <h5 class="modal-title fw-bold mb-0">Bulk Pipeline Deployer</h5>
                            <small class="text-muted">Multi-threaded task architecture logging</small>
                        </div>
                    </div>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body px-4" id="bulk-inputs-container"></div>
                <div class="px-4 mb-3">
                    <button type="button" class="btn btn-light w-100 border border-dashed rounded-3 py-2 fw-bold text-muted" onclick="addBulkRow()">
                        <i class="bi bi-plus-circle me-1"></i> Add Parallel Thread Stack Entry (<span id="bulk-row-count">1</span> / 10)
                    </button>
                </div>
                <div class="modal-footer border-top-0 px-4 pb-4">
                    <button type="button" class="btn btn-light rounded-3 px-4 fw-bold" data-bs-dismiss="modal">Abort</button>
                    <button type="button" class="btn btn-purple text-white rounded-3 px-4 fw-bold" id="btn-submit-bulk" onclick="submitBulkTodos()">
                        <i class="bi bi-cloud-arrow-up-fill me-1"></i> Deploy Stack (<span id="bulk-btn-count">1</span>)
                    </button>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="editTodoModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 rounded-4 shadow-lg bg-glass-modal">
                <div class="modal-header border-bottom-0 px-4 pt-4 d-flex align-items-center justify-content-between">
                    <h5 class="modal-title fw-bold mb-0">Edit Todo</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body px-4">
                    <form id="edit-todo-form">
                        <input type="hidden" id="edit-todo-id">

                        <div class="mb-3">
                            <label class="form-label fw-bold mb-1">Title *</label>
                            <input type="text" id="edit-todo-title" class="form-control rounded-3" placeholder="Update milestone title..." required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold mb-1">Description</label>
                            <textarea id="edit-todo-desc" class="form-control rounded-3" rows="3" placeholder="Update task description..."></textarea>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold mb-1">Status</label>
                            <select id="edit-todo-status" class="form-select rounded-3">
                                <option value="Active">Active</option>
                                <option value="Completed">Completed</option>
                                <option value="Inactive">Inactive</option>
                            </select>
                        </div>
                    </form>
                </div>
                <div class="modal-footer border-top-0 px-4 pb-4 d-flex gap-2">
                    <button type="submit" form="edit-todo-form" class="btn btn-purple text-white rounded-3 px-4 fw-bold flex-grow-1 py-2">
                        <i class="bi bi-save-fill me-1"></i> Save Changes
                    </button>
                    <button type="button" class="btn btn-light border rounded-3 px-4 fw-bold flex-grow-1 py-2" data-bs-dismiss="modal">Cancel</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
